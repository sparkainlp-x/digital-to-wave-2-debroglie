[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-to-wave-2-debroglie"
version = "0.2.0"
description = "Matter-wave test of the object hologram claimed in Mun Seok Lee's 'Digital to Wave' Part II: the relativistic de Broglie wavelength of a macroscopic mass is ~10^37 times shorter than the THz wavelength, with a phase of ~10^31 rad across one lattice spacing; SYNTHETIC, no physical, biological or safety claim"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jean-François Brisson" }]
keywords = ["synthetic-data", "engineering-validity", "de-broglie", "matter-wave", "terahertz", "hologram", "reproducibility", "negative-results", "digital-to-wave"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/sparkainlp-x/digital-to-wave-2-debroglie"

[tool.setuptools]
py-modules = ["matter_wave", "analog_calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
